    <style>
        #savePopup:not([hidden]) {
            position: fixed;
            inset: 0;
            z-index: 99999;
            display: flex;
            align-items: center;
            justify-content: center;
            background: rgba(0, 0, 0, 0.65);
        }

        .popup-content {
            width: min(90%, 360px);
            padding: 24px;
            border-radius: 10px;
            background: white;
            text-align: center;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.3);
        }
    </style>

    <nav class="navbar">

    <div class="contact-container">
    <h1>Contact Me</h1>

  <div class="info-card"> 
    <form id="contactForm">
        <label for="name">Name:</label>
        <input type="text" id="name" required placeholder="Your Full Name">
        

        <label for="email">Email Address:</label>
        <input type="email" id="email" required placeholder="Your Email Address">
        <br><br>

        <label for="phone">Phone Number:</label>
        <input type="tel" id="phone" required placeholder="Your Phone Number">
        <br><br>

        <label for="message">Message:</label>
        <textarea id="message" required placeholder="Type your message"></textarea>
        <br><br>

        <button type="submit" class="submit-btn">Save Contact Info</button>
    </form>
  </div>
 </div>
